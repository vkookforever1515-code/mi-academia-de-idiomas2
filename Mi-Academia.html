function hiddenIdx(line){const toks=line.t.split(/\s+/);let bi=-1,bl=2;toks.forEach((w,i)=>{const c=w.replace(/[^\p{L}]/gu,'');if(c.length>bl){bl=c.length;bi=i}});return bi}
function vSong(){
 const s=curSong();if(!s)return vSongs();
 const lang=s.lang,cl=UI.cloze,tr=UI.showTr;
 const lines=s.lines.map((l,i)=>{
  const toks=l.t.split(/\s+/),hi=cl?hiddenIdx(l):-1;
  const html=toks.map((w,j)=>j===hi?`<input class="cz" data-i="${i}" data-j="${j}" type="text" autocomplete="off" autocapitalize="off" style="width:${Math.max(70,w.length*14)}px;padding:2px 6px;border-radius:8px;display:inline-block;font-size:1rem">`:`<span class="w" data-a="word" data-w="${esc(w.replace(/[^\p{L}'’]/gu,''))}" data-i="${i}">${esc(w)}</span>`).join(' ');
  return `<div class="lyr" id="ly${i}"><div class="between"><div class="t">${html}</div><button class="say" style="margin:0" data-a="say" data-l="${lang}" data-t="${esc(l.t)}">🔊</button></div>${tr&&!cl?`${l.ro?`<div class="small" style="color:var(--ac)">${esc(l.ro)}</div>`:''}${l.es?`<div class="tr">${esc(l.es)}</div>`:''}`:''}</div>`;
 }).join('');
 return `<button class="back" data-a="go" data-v="songs">← Música</button>
 <h2>${esc(s.title)}</h2><div class="muted small">${esc(s.by||'')}</div>
 <div class="row" style="margin:10px 0"><button class="say" data-a="kara" style="justify-content:center">▶️ Karaoke</button><button class="say" data-a="trtog" style="justify-content:center">🌐 Traducción ${tr?'ON':'OFF'}</button></div>
 <div class="row" style="margin-bottom:6px"><button class="say" data-a="clz" style="justify-content:center">${cl?'📖 Ver letra':'🧩 Completa la letra'}</button>${UI.song.src==='lib'?'<button class="say" data-a="savevoc" style="justify-content:center">🧠 Guardar vocabulario</button>':''}</div>
 <div class="card">${lines}${cl?'<button class="btn" data-a="czcheck">Comprobar</button>':'<div class="muted small center" style="margin-top:8px">Toca cualquier palabra para escucharla, traducirla y guardarla.</div>'}</div>`;
}
VIEWS.song=vSong;
H.trtog=()=>{UI.showTr=!UI.showTr;refresh()};
H.clz=()=>{UI.cloze=!UI.cloze;UI.czPaid=false;refresh()};
H.savevoc=()=>{const s=songObj(SONGS.find(x=>x.id===UI.song.id));let n=0;s.vocab.trim().split('\n').forEach(l=>{const p=l.split('|');addSrs(s.lang,p[0],p[1],'');n++});save();flash('🧠 '+n+' palabras guardadas en tu repaso')};
H.kara=()=>{
 const s=curSong();let i=0;UI.stop=false;
 const clear=()=>document.querySelectorAll('.lyr.on').forEach(e=>e.classList.remove('on'));
 const run=()=>{clear();if(UI.stop||i>=s.lines.length)return;const el=$('#ly'+i);if(el){el.classList.add('on');el.scrollIntoView({block:'center',behavior:'smooth'})}speak(s.lines[i].t,s.lang,S.rate,1,()=>{i++;setTimeout(run,300)})};
 run();
};
H.czcheck=()=>{
 const s=curSong();let ok=0,tot=0;
 document.querySelectorAll('.cz').forEach(inp=>{const l=s.lines[+inp.dataset.i],w=l.t.split(/\s+/)[+inp.dataset.j];tot++;const r=judge(inp.value,w,s.lang);if(r)ok++;inp.style.borderColor=r?'var(--good)':'var(--bad)';inp.style.background=r?'#e6f6ee':'#fde8ea';if(!r)inp.value=w;inp.disabled=true});
 flash(`Acertaste ${ok} de ${tot}`);
 if(!UI.czPaid&&ok>0){UI.czPaid=true;addXP(ok*2)}
};
H.word=d=>{
 const w=d.w;if(!w)return;const s=curSong(),lang=s.lang,line=s.lines[+d.i].t;
 speak(w,lang);
 const wr=lang==='ko'?'':`<a class="say" target="_blank" rel="noopener" href="https://www.wordreference.com/${lang}es/${enc(w)}">📘 WordReference</a>`;
 openSheet(`<h2>${esc(w)}</h2><div class="muted small">${esc(line)}</div><div style="margin:8px 0"><button class="say" data-a="say" data-l="${lang}" data-t="${esc(w)}">🔊 Escuchar</button><a class="say" target="_blank" rel="noopener" href="https://translate.google.com/?sl=${lang}&tl=es&text=${enc(w)}&op=translate">🌐 Traducir</a>${wr}</div>
 <input type="text" id="wsv" placeholder="Significado en español" autocomplete="off"><button class="btn" data-a="wsave" data-w="${esc(w)}" data-l="${lang}" data-x="${esc(line)}">🧠 Guardar en mi repaso</button>`);
};
H.wsave=d=>{const es=($('#wsv').value||'').trim();if(!es){flash('Escribe el significado para guardarla');return}addSrs(d.l,d.w,es,d.x);save();checkBadges();flash('🧠 Guardada en tu repaso');closeSheet()};

/* ========== SERIES ========== */
function vSeries(){
 const lang=S.lang,tab=UI.rtab||'oido',sp=SPEECH[lang];
 const tabs=`<div class="tabs"><button class="${tab==='oido'?'on':''}" data-a="rtab" data-v="oido">Oído real</button><button class="${tab==='esc'?'on':''}" data-a="rtab" data-v="esc">Escenas</button><button class="${tab==='met'?'on':''}" data-a="rtab" data-v="met">Método</button></div>`;
 let b='';
 if(tab==='oido'){
  b=`<div class="card soft small">${esc(sp.intro)}</div>`+sp.items.trim().split('\n').map(l=>{const p=l.split('|');return `<div class="card"><div class="between"><div><div class="serif" style="font-size:1.5rem;color:var(--ac)">${esc(p[0])}</div><div class="muted small">se escribe: <b>${esc(p[1])}</b></div></div><button class="say" style="margin:0" data-a="say" data-t="${esc(p[2])}">🔊</button></div><div style="margin-top:8px">${esc(p[2])}</div><div class="muted small">${esc(p[3])}</div></div>`}).join('');
 }else if(tab==='esc'){
  b=SCENES.filter(s=>s.lang===lang).map(s=>`<button class="card song" data-a="scene" data-id="${s.id}"><span class="ic">🎬</span><div><b>${esc(s.title)}</b><div class="muted small">Nivel ${s.lvl} · escena con diálogo natural</div></div></button>`).join('');
 }else{
  const shows=(SHOWS[lang]||[]).map(x=>`<span class="chip2">${esc(x)}</span>`).join('');
  b=`<div class="card"><h3>Método de 3 pasadas</h3><div class="small" style="margin-top:6px"><b>1. Entender la historia:</b> mira un episodio con subtítulos en español.<br><b>2. Atrapar el idioma:</b> repítelo con subtítulos en ${LANGS[lang].name}; pausa y anota 5 frases.<br><b>3. Entrenar el oído:</b> vuélvelo a ver sin subtítulos y repite en voz alta imitando la entonación (shadowing).</div></div>
  <div class="card"><h3>Series para tu nivel</h3><div class="chips">${shows}</div><div class="muted small">Tip: las extensiones como Language Reactor te muestran dos subtítulos a la vez en Netflix/YouTube desde el computador.</div></div>
  <div class="card"><h3>📝 Guardar frase de una serie</h3><input type="text" id="ph-w" placeholder="Frase en ${LANGS[lang].name}" style="margin-bottom:8px"><input type="text" id="ph-e" placeholder="Significado en español"><button class="btn" data-a="phsave">Guardar en mi repaso</button></div>`;
 }
 return `<h2 style="margin-top:16px">🎬 Entiende series en ${LANGS[lang].name}</h2>${tabs}${b}`;
}
VIEWS.series=vSeries;
H.rtab=d=>{UI.rtab=d.v;refresh()};
H.phsave=()=>{const w=$('#ph-w').value.trim(),e=$('#ph-e').value.trim();if(!w||!e){flash('Escribe la frase y su significado');return}addSrs(S.lang,w,e,'');save();checkBadges();$('#ph-w').value='';$('#ph-e').value='';flash('🧠 Frase guardada')};
H.scene=d=>{UI.scene=d.id;UI.smode=0;UI.sq={};go('scene')};
const parseScene=l=>{const p=l.split('|'),m=p[0].match(/^([^:]+):\s*(.*)$/);return{who:m?m[1]:'',t:m?m[2]:p[0],es:p[1]||''}};
function vScene(){
 const sc=SCENES.find(s=>s.id===UI.scene);if(!sc)return vSeries();
 const lines=sc.lines.trim().split('\n').map(parseScene),mode=UI.smode||0;
 const modes=['Sin subtítulos','En '+LANGS[sc.lang].name,'En español'];
 const ls=lines.map((l,i)=>`<div class="lyr" id="ly${i}"><b style="color:var(--ac)">${esc(l.who)}</b> ${mode===1?esc(l.t):mode===2?esc(l.es):'<span class="muted">· · ·</span>'}</div>`).join('');
 const qs=sc.q.map((q,qi)=>{const a=UI.sq[qi];return `<div class="card"><b>${esc(q[0])}</b>`+q[1].map((o,i)=>`<button class="opt ${a!==undefined?(i===q[2]?'good':(i===a?'bad':'')):''}" data-a="sq" data-q="${qi}" data-i="${i}" ${a!==undefined?'disabled':''}>${esc(o)}</button>`).join('')+'</div>'}).join('');
 return `<button class="back" data-a="go" data-v="series">← Series</button><h2>🎬 ${esc(sc.title)}</h2><span class="tag">Nivel ${sc.lvl}</span>
 <div class="card soft small" style="margin-top:12px"><b>Paso 1:</b> escucha sin subtítulos. <b>Paso 2:</b> activa el idioma original. <b>Paso 3:</b> mira la traducción y repite en voz alta.</div>
 <button class="btn" data-a="play">▶️ Reproducir escena</button>
 <div class="tabs">${modes.map((m,i)=>`<button class="${mode===i?'on':''}" data-a="smode" data-v="${i}">${m}</button>`).join('')}</div>
 <div class="card">${ls}</div><h3>Comprueba que entendiste</h3>${qs}`;
}
VIEWS.scene=vScene;
H.smode=d=>{UI.smode=+d.v;refresh()};
H.sq=d=>{const sc=SCENES.find(s=>s.id===UI.scene),q=sc.q[+d.q];UI.sq[+d.q]=+d.i;if(+d.i===q[2])addXP(3);refresh()};
H.play=()=>{
 const sc=SCENES.find(s=>s.id===UI.scene),lines=sc.lines.trim().split('\n').map(parseScene);let i=0;UI.stop=false;const who={};
 const run=()=>{document.querySelectorAll('.lyr.on').forEach(e=>e.classList.remove('on'));if(UI.stop||i>=lines.length)return;const l=lines[i];if(!(l.who in who))who[l.who]=Object.keys(who).length%2?0.82:1.18;const el=$('#ly'+i);if(el)el.classList.add('on');speak(l.t,sc.lang,S.rate+0.1,who[l.who],()=>{i++;setTimeout(run,450)})};
 run();
};

/* ========== RANKING / PERFIL ========== */
let DEFER=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER=e});
function vLeague(){
 const rows=standings(weekProg(),S.weekXp,S.tier,S.week),me=rows.findIndex(r=>r.me)+1;
 const t=today(),start=addDays(weekStart(),-28);
 let heat='';for(let i=0;i<35;i++){const d=addDays(start,i);if(d>t){heat+='<i style="opacity:.25"></i>';continue}const x=S.days[d]||0;heat+=`<i class="${x>=S.goal?'l3':x>=S.goal/2?'l2':x>0?'l1':''} ${d===t?'t':''}" title="${d}: ${x} XP"></i>`}
 const dl=7-((new Date().getDay()+6)%7);
 const words=Object.keys(S.srs).length;
 return `<h2 style="margin-top:16px">${TIERE[S.tier]} Liga ${TIERS[S.tier]}</h2><div class="muted small">Los 3 primeros suben de liga · terminan en ${dl} día${dl===1?'':'s'}${S.lastRank&&S.lastRank.msg?' · '+esc(S.lastRank.msg):''}</div>
 <div class="card">${rows.map((r,i)=>`<div class="lrow ${r.me?'me':''}"><span class="rk">${i+1}</span><span class="nm">${r.me?'⭐ ':''}${esc(r.n)}</span><span>${r.xp} XP</span></div>`).join('')}</div>
 <div class="muted small center">Compites contra estudiantes simulados: el objetivo es superarte a ti misma cada semana 💜</div>
 <h2 style="margin-top:20px">Tu racha</h2>
 <div class="stats"><div class="stat"><b>🔥 ${S.streak}</b><span>racha actual</span></div><div class="stat"><b>${S.best}</b><span>mejor racha</span></div><div class="stat"><b>❄️ ${S.freezes}</b><span>congeladores</span></div><div class="stat"><b>${S.xp}</b><span>XP total</span></div><div class="stat"><b>${words}</b><span>palabras</span></div><div class="stat"><b>${unitsDone()}</b><span>unidades</span></div></div>
 <div class="card"><div class="heat">${heat}</div><div class="muted small" style="margin-top:8px">Últimas 5 semanas. Cada 7 días de racha ganas un ❄️ que protege un día que falles.</div></div>
 <h2>Insignias</h2><div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b[0]]?'':'off'}"><span class="e">${b[1]}</span>${b[2]}</div>`).join('')}</div>
 <div class="row" style="margin-top:18px"><button class="btn alt" data-a="go" data-v="diary">📓 Mi diario</button><button class="btn alt" data-a="go" data-v="teachers">🎓 Mis profes</button></div>
 <h2 style="margin-top:14px">Ajustes</h2>
 <div class="card"><label class="small muted">Meta diaria</label><select id="goal">${[15,30,50,100].map(x=>`<option ${S.goal===x?'selected':''} value="${x}">${x} XP</option>`).join('')}</select>
 <label class="small muted" style="display:block;margin-top:10px">Velocidad de la voz</label><select id="rate">${[[.65,'Lenta'],[.85,'Normal'],[1,'Rápida']].map(x=>`<option ${S.rate===x[0]?'selected':''} value="${x[0]}">${x[1]}</option>`).join('')}</select>
 <button class="btn alt" data-a="export">💾 Descargar copia de mi progreso</button><label class="btn ghost" style="cursor:pointer">📥 Restaurar copia<input type="file" id="imp" accept=".json" style="display:none"></label>
 ${DEFER?'<button class="btn gold" data-a="install">📲 Instalar app</button>':''}
 <div class="muted small">Tu progreso vive en este dispositivo. Descarga una copia de vez en cuando para no perderlo si cambias de teléfono.</div>
 <button class="btn ghost" data-a="reset" style="color:var(--bad)">Borrar todo mi progreso</button></div>`;
}
VIEWS.league=vLeague;
document.addEventListener('change',e=>{
 if(e.target.id==='goal'){S.goal=+e.target.value;save();flash('Meta actualizada')}
 if(e.target.id==='rate'){S.rate=+e.target.value;save();speak('Hello, bonjour, ciao',S.lang)}
 if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);S=Object.assign({},DEF,o);S.lvl=Object.assign({},DEF.lvl,S.lvl||{});save();boot();flash('✅ Progreso restaurado');render()}catch(x){flash('Archivo no válido')}};r.readAsText(f)}
});
H.export=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mi-academia-respaldo-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();flash('💾 Copia descargada')};
H.install=async()=>{if(DEFER){DEFER.prompt();DEFER=null;refresh()}};
H.reset=()=>{if(confirm('¿Seguro? Se borrará todo tu progreso.')&&confirm('Última confirmación: no se puede deshacer.')){S=JSON.parse(JSON.stringify(DEF));S.lvl=Object.assign({},DEF.lvl);try{localStorage.removeItem(KEY)}catch(e){}boot();render()}};

function vDiary(){
 return `<button class="back" data-a="go" data-v="league">← Ranking</button><h2>📓 Mi diario de escritura</h2>`
 +(S.diary.length?S.diary.map(d=>`<div class="card"><div class="between"><b>${esc(d.title)}</b><span class="tag">${LANGS[d.lang].flag} ${d.d}</span></div><div class="read small" style="margin-top:8px">${esc(d.text)}</div></div>`).join(''):'<div class="card muted center">Aquí aparecerán los textos que escribas en las actividades de Escritura.</div>');
}
VIEWS.diary=vDiary;

function vTeachers(){
 return `<button class="back" data-a="go" data-v="league">← Ranking</button><h2>🎓 Tus profes</h2><div class="muted small">Cada idioma tiene su profe virtual que te explica la gramática y te da un consejo del día.</div>`
 +Object.keys(LANGS).map(l=>{const T=TEACH[l],tips=TIPS[l];return `<div class="card" style="border-left:6px solid ${LANGS[l].color}"><div class="row" style="align-items:flex-start"><div class="avatar" style="background:${LANGS[l].color};flex:0 0 42px">${T.icon}</div><div><b>${T.name}</b><div class="muted small">${T.role}</div></div></div><p class="small">${T.bio}</p><div class="bubble" style="--ac:${LANGS[l].color}">💡 ${esc(tips[dayNum()%tips.length])}</div>${l!==S.lang?`<button class="btn alt" data-a="lang" data-l="${l}">Estudiar ${LANGS[l].name}</button>`:''}</div>`}).join('');
}
VIEWS.teachers=vTeachers;
</script>
<script>
boot();render();
</script>
</body>
</html>
