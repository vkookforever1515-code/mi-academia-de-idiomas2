<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Academia de Idiomas</title>
<meta name="theme-color" content="#3B1F47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Academia">
<style>:root{--bg:#FBF5EF;--ink:#2B1B33;--mut:#7D6C84;--card:#fff;--plum:#3B1F47;--plum2:#5A2F66;--rose:#E58BA7;--gold:#C9A24B;--line:#EDE1E4;--ac:#C2548A;--good:#2E9E6B;--bad:#D4505F;--r:20px;--sh:0 8px 24px rgba(59,31,71,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(900px 420px at 100% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),radial-gradient(700px 420px at -10% 40%,rgba(201,162,75,.12),transparent);background-attachment:fixed;color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;min-height:100vh;padding-bottom:92px}
h1,h2,h3,.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;letter-spacing:.2px;margin:0}
h2{font-size:1.35rem;margin-bottom:.4rem}h3{font-size:1.1rem}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--plum),var(--plum2));color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;box-shadow:0 6px 18px rgba(59,31,71,.25)}
.top .wrap{display:block}.top .between{flex-wrap:nowrap}
.brand{font-family:Georgia,serif;font-size:1.15rem;letter-spacing:.4px;white-space:nowrap}.brand b{color:var(--gold)}
.pills{display:flex;gap:6px;align-items:center}
.pill{background:rgba(255,255,255,.14);border-radius:99px;padding:3px 10px;font-size:.88rem;white-space:nowrap}
.pill b{font-weight:700}
.iconbtn{background:rgba(255,255,255,.14);border-radius:99px;width:32px;height:32px;display:grid;place-items:center}
.langs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:99px;padding:6px 14px;background:rgba(255,255,255,.12);color:#fff;font-size:.92rem;border:1.5px solid transparent}
.chip.on{background:#fff;color:var(--plum);font-weight:700}

/* cards & basics */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:14px 0;border:1px solid var(--line)}
.card.soft{background:color-mix(in srgb,var(--ac) 8%,#fff)}
.muted{color:var(--mut)}.small{font-size:.86rem}.center{text-align:center}
.btn{display:block;width:100%;background:var(--ac);color:#fff;border-radius:16px;padding:13px 16px;font-weight:700;text-align:center;box-shadow:0 6px 0 color-mix(in srgb,var(--ac) 65%,#000);margin:14px 0 8px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--ac) 65%,#000)}
.btn.alt{background:#fff;color:var(--ac);border:2px solid var(--ac);box-shadow:none}
.btn.ghost{background:transparent;color:var(--mut);box-shadow:none;border:1.5px dashed var(--line)}
.btn.gold{background:var(--gold);box-shadow:0 6px 0 #9c7d34}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;background:color-mix(in srgb,var(--ac) 14%,#fff);color:var(--ac);font-weight:700}
input[type=text],textarea,select{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:120px;resize:vertical}

/* hero (path) */
.hero{display:flex;gap:14px;align-items:center}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:0 0 auto}
.ring span{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:.95rem}
.bubble{background:color-mix(in srgb,var(--ac) 9%,#fff);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:.92rem}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:1.3rem;flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}

.lvtabs{display:flex;gap:8px;margin:16px 0 0}
.lvtab{flex:1;padding:10px 4px;border-radius:14px;background:#fff;border:1.5px solid var(--line);text-align:center;font-weight:700;font-size:.95rem}
.lvtab small{display:block;font-weight:500;color:var(--mut);font-size:.7rem}
.lvtab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.lvtab.on small{color:#ffffffcc}

.path{display:flex;flex-direction:column;gap:6px;margin:18px 0}
.node{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:var(--sh);width:92%;text-align:left}
.node:nth-child(even){align-self:flex-end}
.node .bub{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:0 0 auto}
.node .bub span{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.4rem}
.node .t{font-weight:700;line-height:1.25}
.node.done .bub span{background:color-mix(in srgb,var(--gold) 28%,#fff)}

/* unit acts */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.act{background:#fff;border-radius:20px;border:1px solid var(--line);box-shadow:var(--sh);padding:16px 12px;text-align:center;position:relative}
.act .ic{font-size:1.9rem}.act .nm{font-weight:700;margin-top:2px}.act small{display:block;color:var(--mut)}
.act.ok{background:color-mix(in srgb,var(--good) 8%,#fff);border-color:color-mix(in srgb,var(--good) 40%,#fff)}
.act .ck{position:absolute;top:8px;right:10px;color:var(--good);font-weight:900}

/* session */
.sbar{display:flex;align-items:center;gap:12px;margin:16px 0}
.prog{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--gold));border-radius:99px;transition:width .3s}
.x{font-size:1.2rem;color:var(--mut);padding:4px 8px}
.q{font-size:1.3rem;margin:14px 0;line-height:1.35}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;margin:9px 0;font-weight:600;box-shadow:0 3px 0 var(--line)}
.opt:active{transform:translateY(2px)}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,#fff);box-shadow:0 3px 0 var(--good)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,#fff);box-shadow:0 3px 0 var(--bad)}
.fb{border-radius:16px;padding:12px 14px;margin:12px 0;font-size:.95rem}
.fb.good{background:color-mix(in srgb,var(--good) 14%,#fff);color:#17623f}.fb.bad{background:color-mix(in srgb,var(--bad) 12%,#fff);color:#8e2634}
.say{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--ac) 12%,#fff);color:var(--ac);border-radius:99px;padding:8px 14px;font-weight:700;margin:4px 6px 4px 0}
.say.big{padding:14px 22px;font-size:1.05rem}
.flash{text-align:center;padding:24px 14px}
.flash .w{font-size:2.3rem;font-family:Georgia,'Apple SD Gothic Neo','Noto Sans KR',serif;margin:6px 0;line-height:1.2;color:var(--plum)}
.flash .pr{color:var(--ac);font-weight:700}
.flash .es{font-size:1.2rem;font-weight:700;margin-top:8px}
.ex{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);text-align:left}
.read{white-space:pre-line;font-size:1.08rem;line-height:1.7}
.grammar h3{margin:4px 0 6px}.grammar ul{padding-left:20px}.grammar li{margin:4px 0}
.wc{font-size:.85rem;color:var(--mut);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip2{border-radius:99px;padding:4px 10px;background:#f3eaee;font-size:.85rem}
.chip2.hit{background:color-mix(in srgb,var(--good) 20%,#fff);color:#17623f;font-weight:700}
.done .big{font-size:3.2rem}
.spark{font-size:2rem;animation:pop .8s ease both}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.mic{width:84px;height:84px;border-radius:50%;background:var(--ac);color:#fff;font-size:2rem;display:grid;place-items:center;margin:10px auto;box-shadow:0 8px 0 color-mix(in srgb,var(--ac) 60%,#000)}
.mic.rec{animation:pulse 1s infinite;background:var(--bad)}
@keyframes pulse{50%{transform:scale(1.08)}}

/* lists */
.song{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.song .ic{font-size:1.6rem}
.lyr{padding:10px 0;border-bottom:1px solid var(--line)}
.lyr .t{font-size:1.1rem;line-height:1.5}.lyr .tr{color:var(--mut);font-size:.92rem;margin-top:2px}
.lyr .w{cursor:pointer;border-radius:6px;padding:0 1px}.lyr .w:active{background:color-mix(in srgb,var(--ac) 20%,#fff)}
.cloze{display:inline-block;min-width:70px;border-bottom:2px solid var(--ac);text-align:center;color:var(--ac)}
.tabs{display:flex;gap:6px;background:#f1e7ea;border-radius:16px;padding:4px;margin:12px 0}
.tabs button{flex:1;padding:9px 4px;border-radius:12px;font-weight:700;font-size:.9rem;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);max-width:600px;margin:0 auto}
.scrim{position:fixed;inset:0;background:rgba(40,20,50,.35);z-index:40}

/* league / profile */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.4rem;font-family:Georgia,serif}.stat span{font-size:.75rem;color:var(--mut)}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:14px}
.lrow.me{background:color-mix(in srgb,var(--gold) 22%,#fff);font-weight:800}
.lrow .rk{width:26px;text-align:center;font-weight:800;color:var(--mut)}
.lrow .nm{flex:1}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:8px;background:var(--line);display:block}
.heat i.l1{background:color-mix(in srgb,var(--ac) 30%,#fff)}.heat i.l2{background:color-mix(in srgb,var(--ac) 60%,#fff)}.heat i.l3{background:var(--ac)}
.heat i.t{outline:2px solid var(--gold)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;font-size:.78rem;padding:10px 4px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.badge .e{font-size:1.8rem;display:block}.badge.off{opacity:.35;filter:grayscale(1)}

/* nav & toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);display:flex;box-shadow:0 -6px 20px rgba(59,31,71,.08)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.7rem;color:var(--mut);padding:4px 0;position:relative}
.nav button .e{font-size:1.35rem;filter:grayscale(.6)}
.nav button.on{color:var(--ac);font-weight:700}.nav button.on .e{filter:none}
.nav .dot{position:absolute;top:0;right:22%;background:var(--bad);color:#fff;font-size:.62rem;border-radius:99px;padding:0 5px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--plum);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;opacity:0;transition:.25s;pointer-events:none;font-size:.92rem;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.back{color:var(--mut);padding:10px 0;display:inline-block}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
a{color:var(--ac)}

.lyr.on{background:color-mix(in srgb,var(--gold) 28%,#fff);border-radius:12px;padding-left:8px}
.cz{border:2px solid var(--ac);outline:none}
.row .say{white-space:nowrap;padding:9px 6px;font-size:.84rem}
.chip.on{scroll-margin:0 40px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="between"><div class="brand">✦ Mi <b>Academia</b></div><div class="pills" id="pills"></div></div>
  <div class="langs" id="langs"></div>
</div></header>
<main class="wrap" id="app"></main>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>
<div id="layer"></div>
<script>window.C={};
window.U=function(lang,lvl,title,o){
 const L=(C[lang]=C[lang]||{});const arr=(L[lvl]=L[lvl]||[]);
 const id=lang+'-'+lvl+'-'+(arr.length+1);
 const v=o.v.trim().split('\n').map(l=>{const p=l.trim().split('|');return{w:p[0],es:p[1],ex:p[2]||'',exEs:p[3]||'',pr:p[4]||''}});
 const l=(o.l||'').trim()?o.l.trim().split('\n').map(x=>{const p=x.trim().split('|');return{t:p[0],es:p[1]||''}}):[];
 arr.push({id,lang,lvl,title,emoji:o.e||'✦',v,l,g:o.g,r:o.r,w:o.w});
};
</script>
<script>/* INGLÉS A1–B2 */
U('en','a1','Hello! Saludos y presentaciones',{e:'👋',
v:`Hello|Hola|Hello, my name is Ana.|Hola, mi nombre es Ana.
Goodbye|Adiós|Goodbye, see you tomorrow!|¡Adiós, hasta mañana!
Please|Por favor|A coffee, please.|Un café, por favor.
Thank you|Gracias|Thank you very much.|Muchas gracias.
Sorry|Perdón / lo siento|Sorry, I am late.|Perdón, llego tarde.
Name|Nombre|What is your name?|¿Cómo te llamas?
Nice to meet you|Mucho gusto|Nice to meet you, Tom.|Mucho gusto, Tom.
How are you?|¿Cómo estás?|Hi! How are you today?|¡Hola! ¿Cómo estás hoy?`,
l:`Good morning, teacher.|Buenos días, profesor.
Where are you from?|¿De dónde eres?
I am fine, thanks.|Estoy bien, gracias.`,
g:{t:'El verbo «to be» (ser / estar)',h:`<p>En inglés el verbo <b>to be</b> sirve para <i>ser</i> y <i>estar</i>. Siempre necesitas decir el sujeto.</p><ul><li><b>I am</b> → yo soy / estoy (I'm)</li><li><b>You are</b> → tú eres / ustedes son (you're)</li><li><b>He / She / It is</b> → él / ella / eso es (he's, she's, it's)</li><li><b>We / They are</b> → nosotros / ellos son (we're, they're)</li></ul><p><b>Negativo:</b> agrega <b>not</b> → <i>I am not, She isn't, They aren't</i>.</p><p><b>Pregunta:</b> invierte el orden → <i>Are you ready?</i></p>`,
x:[["I ___ from Colombia.",["am","is","are"],0,"Con «I» usamos siempre «am»."],
["She ___ my friend.",["am","is","are"],1,"She / he / it → is."],
["We ___ students.",["am","is","are"],2,"We / you / they → are."],
["___ you tired?",["Am","Is","Are"],2,"En preguntas: «Are you…?»"],
["He ___ at home. (negativo)",["isn't","aren't","am not"],0,"He is not = he isn't."]]},
r:{t:'Meet Laura',s:`Hi! My name is Laura. I am from Bucaramanga, Colombia. I am 21 years old and I am a student. I like English and music.`,es:`¡Hola! Me llamo Laura. Soy de Bucaramanga, Colombia. Tengo 21 años y soy estudiante. Me gustan el inglés y la música.`,q:[["Where is Laura from?",["Medellín","Bucaramanga","Bogotá"],1],["How old is Laura?",["19","21","25"],1]]},
w:{p:'Preséntate: tu nombre, de dónde eres, tu edad y qué te gusta (mínimo 4 frases).',m:`Hi! My name is Ana. I am from Bogotá. I am 20 years old. I like music and movies.`,k:["My name is","I am from","I am","I like"],n:12}});

U('en','a1','Colores y objetos',{e:'🎨',
v:`Red|Rojo|The bag is red.|El bolso es rojo.
Blue|Azul|I have a blue phone.|Tengo un teléfono azul.
Green|Verde|The apple is green.|La manzana es verde.
Book|Libro|The book is on the table.|El libro está sobre la mesa.
Phone|Teléfono|My phone is new.|Mi teléfono es nuevo.
Bag|Bolso / mochila|She has a small bag.|Ella tiene un bolso pequeño.
Table|Mesa|The table is big.|La mesa es grande.
Chair|Silla|Sit on the chair, please.|Siéntate en la silla, por favor.`,
l:`I have three red pens.|Tengo tres bolígrafos rojos.
There are five chairs.|Hay cinco sillas.`,
g:{t:'Artículos a / an / the y plurales',h:`<p><b>a</b> + sonido de consonante (a book). <b>an</b> + sonido de vocal (an apple). <b>the</b> cuando es algo específico o único (the sun).</p><p><b>Plural:</b> casi siempre agrega <b>-s</b> → book → books. Si termina en s, x, ch, sh agrega <b>-es</b> → box → boxes.</p><p>Para decir «hay»: <b>There is</b> (uno) / <b>There are</b> (varios).</p>`,
x:[["I have ___ apple.",["a","an","the"],1,"«apple» empieza con sonido vocal → an."],
["She has ___ book.",["a","an","two"],0,"«book» empieza con consonante → a."],
["I have two ___.",["book","books","a books"],1,"Plural → agrega -s."],
["___ sun is hot today.",["A","An","The"],2,"Hay un solo sol: usamos the."],
["This is ___ umbrella.",["a","an","the"],1,"«umbrella» empieza con sonido vocal → an."]]},
r:{t:'My room',s:`My room is small. There is a blue bed and a white table. On the table there are two books and a green lamp. I like my room.`,es:`Mi cuarto es pequeño. Hay una cama azul y una mesa blanca. Sobre la mesa hay dos libros y una lámpara verde. Me gusta mi cuarto.`,q:[["What color is the bed?",["Blue","Green","White"],0],["How many books are there?",["One","Two","Three"],1]]},
w:{p:'Describe tu cuarto o tu bolso: objetos y colores (mínimo 4 frases).',m:`My room is small. There is a white bed and a brown table. On the table there are three books and a red lamp.`,k:["There is","There are","I have"],n:12}});

U('en','a1','Mi rutina diaria',{e:'⏰',
v:`Wake up|Despertarse|I wake up at six.|Me despierto a las seis.
Have breakfast|Desayunar|She has breakfast at seven.|Ella desayuna a las siete.
Go to class|Ir a clase|We go to class every day.|Vamos a clase todos los días.
Study|Estudiar|I study English at night.|Estudio inglés por la noche.
Have lunch|Almorzar|They have lunch at noon.|Ellos almuerzan al mediodía.
Go home|Ir a casa|He goes home at five.|Él va a casa a las cinco.
Watch TV|Ver televisión|I watch TV after dinner.|Veo televisión después de la cena.
Go to bed|Ir a dormir|I go to bed at eleven.|Me acuesto a las once.`,
l:`What time is it?|¿Qué hora es?
She studies every night.|Ella estudia todas las noches.`,
g:{t:'Presente simple: hábitos y rutinas',h:`<p>Usamos el <b>presente simple</b> para rutinas y hechos: <i>I study every day</i>.</p><ul><li>I / you / we / they + verbo → <i>I work</i></li><li>He / she / it + verbo<b>+s</b> → <i>She works</i> (study → studies, go → goes, have → has)</li></ul><p><b>Negativo:</b> don't (I, you, we, they) / doesn't (he, she, it) + verbo base.</p><p><b>Pregunta:</b> Do / Does + sujeto + verbo base → <i>Does she work?</i></p>`,
x:[["She ___ English every day.",["study","studies","studys"],1,"She + verbo con -s; study → studies."],
["They ___ lunch at noon.",["has","have","haves"],1,"They → have."],
["He ___ to class by bus.",["go","goes","going"],1,"go → goes con he/she/it."],
["I ___ like coffee. (negativo)",["don't","doesn't","not"],0,"I + don't."],
["___ she work on Saturdays?",["Do","Does","Is"],1,"Con she usamos Does."]]},
r:{t:'A normal day',s:`Every day I wake up at six. I have breakfast at seven and I go to the university. I study until two. Then I have lunch with my friends. At night I watch TV and I go to bed at eleven.`,es:`Todos los días me despierto a las seis. Desayuno a las siete y voy a la universidad. Estudio hasta las dos. Luego almuerzo con mis amigos. En la noche veo televisión y me acuesto a las once.`,q:[["What time does the speaker wake up?",["Five","Six","Seven"],1],["Who does the speaker have lunch with?",["Family","Friends","A teacher"],1]]},
w:{p:'Cuenta tu rutina de un día normal (mínimo 5 frases).',m:`I wake up at six. I have breakfast at seven. I go to class at eight. I study in the afternoon. I go to bed at eleven.`,k:["I wake up","I go to","I study","every day"],n:20}});

U('en','a2','En el restaurante',{e:'🍽️',

g:{t:'Pedir con educación: would like, could, some / any',h:`<p>Para pedir con cortesía: <b>I would like…</b> (quisiera), <b>Could I have…?</b> (¿podría tomar…?).</p><p><b>some</b> → frases afirmativas (<i>I have some water</i>). <b>any</b> → negativas y preguntas (<i>I don't have any bread. Is there any milk?</i>).</p><p>Con sustantivos contables en plural y con los incontables (water, milk, rice) usamos some / any.</p>`,
x:[["I ___ like a coffee, please.",["will","would","am"],1,"«I would like» = quisiera."],
["There is ___ milk in the fridge.",["some","any","a"],0,"Afirmativa → some."],
["We don't have ___ bread.",["some","any","an"],1,"Negativa → any."],
["___ I have the menu, please?",["Could","Are","Do"],0,"«Could I…?» = petición educada."],
["Is there ___ sugar?",["some","any","a"],1,"En preguntas usamos any."]]},
r:{t:'At the restaurant',s:`Waiter: Good evening! Are you ready to order?
Maria: Yes, I would like the chicken soup, please.
Waiter: Anything to drink?
Maria: Some water, please.
Waiter: Of course.
Maria: Thank you. The soup is delicious!`,es:`Mesero: ¡Buenas noches! ¿Están listos para pedir?
María: Sí, quisiera la sopa de pollo, por favor.
Mesero: ¿Algo de beber?
María: Un poco de agua, por favor.
Mesero: Por supuesto.
María: Gracias. ¡La sopa está deliciosa!`,q:[["What does Maria order?",["Fish","Chicken soup","Salad"],1],["What does she drink?",["Water","Juice","Coffee"],0]]},
w:{p:'Escribe un diálogo corto pidiendo comida en un restaurante (mínimo 30 palabras).',m:`Good evening. I would like a pizza, please. Could I have some water? Thank you. Can we have the bill, please?`,k:["I would like","Could I","some","please"],n:30}});

g:{t:'Pasado simple: regulares e irregulares',h:`<p>Para hablar del pasado terminado:</p><ul><li><b>Regulares:</b> verbo + <b>-ed</b> → visit → visited, arrive → arrived.</li><li><b>Irregulares</b> (hay que memorizar): go → <b>went</b>, see → <b>saw</b>, have → <b>had</b>, buy → <b>bought</b>, eat → <b>ate</b>.</li></ul><p><b>Negativo:</b> didn't + verbo base → <i>I didn't go</i>. <b>Pregunta:</b> Did + sujeto + verbo base → <i>Did you go?</i></p>`,
x:[["Yesterday I ___ my friends.",["visit","visited","visiting"],1,"Pasado regular → -ed."],
["We ___ to Cartagena last summer.",["go","goed","went"],2,"go → went (irregular)."],
["She ___ a ticket online.",["buyed","bought","buy"],1,"buy → bought."],
["I ___ see the museum. (negativo)",["didn't","don't","wasn't"],0,"didn't + verbo base."],
["___ you enjoy the trip?",["Did","Do","Were"],0,"Pregunta en pasado → Did."]]},
r:{t:'Last summer',s:`Last summer I traveled to Cartagena with my family. We arrived at the airport at six in the morning. The hotel was near the beach. We visited the old city and ate fresh fish. It was an amazing trip!`,es:`El verano pasado viajé a Cartagena con mi familia. Llegamos al aeropuerto a las seis de la mañana. El hotel estaba cerca de la playa. Visitamos la ciudad vieja y comimos pescado fresco. ¡Fue un viaje increíble!`,q:[["When did they arrive at the airport?",["At six in the morning","At night","At noon"],0],["What did they eat?",["Fresh fish","Pizza","Soup"],0]]},
w:{p:'Cuenta tu último viaje o fin de semana en pasado (mínimo 5 frases).',m:`Last weekend I went to my grandmother's house. We cooked lunch and watched a movie. I ate a lot! It was a great day.`,k:["I went","We visited","I saw","It was"],n:30}});

g:{t:'Futuro: going to, will y presente continuo',h:`<ul><li><b>be going to + verbo:</b> planes ya decididos o evidencias → <i>I'm going to visit my grandma.</i></li><li><b>will + verbo:</b> decisiones espontáneas, promesas, predicciones → <i>I'll help you!</i></li><li><b>Presente continuo:</b> citas ya organizadas → <i>I'm meeting Ana at 5.</i></li></ul>`,

r:{t:'My weekend plans',s:`This weekend I am going to relax. On Saturday I am meeting my friends at the cinema. We are going to watch a comedy. On Sunday I will probably visit my grandmother. Maybe we will cook together.`,es:`Este fin de semana voy a descansar. El sábado me encuentro con mis amigos en el cine. Vamos a ver una comedia. El domingo probablemente visite a mi abuela. Quizás cocinemos juntas.`,q:[["What are they going to watch?",["A comedy","A horror movie","A drama"],0],["Who will the speaker visit on Sunday?",["Her grandmother","Her teacher","Her cousin"],0]]},
w:{p:'Escribe tus planes para este fin de semana (mínimo 5 frases).',m:`This weekend I am going to study English. On Saturday I am meeting my friends. On Sunday I will rest. Maybe I will watch a movie.`,k:["I am going to","I will","Maybe","This weekend"],n:30}});

g:{t:'Presente perfecto: have / has + participio',h:`<p>Une el pasado con el presente: experiencias de vida y resultados actuales.</p><ul><li><b>have / has + participio</b> → <i>I have visited Spain.</i></li><li><b>ever / never</b> (experiencias), <b>already</b> (ya, afirmativa), <b>yet</b> (todavía, negativas y preguntas).</li><li><b>for</b> + duración (for two years) / <b>since</b> + punto de inicio (since 2019).</li></ul><p>No se usa con tiempo terminado (yesterday, last year): ahí va pasado simple.</p>`,
x:[["She has already ___ the report.",["finish","finished","finishing"],1,"have/has + participio: finished."],

["He ___ lived abroad for two years.",["have","has","is"],1,"He → has."]]},
r:{t:'Planning a trip',s:`I have traveled to five countries and I have tried many different foods. I have never been to Asia, but I have already planned a trip to Japan. I haven't bought the tickets yet, but I have saved some money.`,es:`He viajado a cinco países y he probado muchas comidas distintas. Nunca he estado en Asia, pero ya he planeado un viaje a Japón. Todavía no he comprado los tiquetes, pero he ahorrado algo de dinero.`,q:[["Has the speaker been to Asia?",["Yes, twice","No, never","Yes, always"],1],["What hasn't the speaker done yet?",["Bought the tickets","Planned the trip","Saved money"],0]]},
w:{p:'Escribe 3 cosas que has hecho y 2 que nunca has hecho (mínimo 5 frases).',m:`I have visited Cartagena and I have learned some English. I have tried Italian food. I have never traveled by plane. I have never seen the snow.`,k:["I have","I have never","already","yet"],n:45}});

v:`Deadline|Fecha límite|We need to meet the deadline.|Debemos cumplir la fecha límite.

g:{t:'Condicionales cero y primero',h:`<ul><li><b>Cero (hechos):</b> If + presente, presente → <i>If you heat ice, it melts.</i></li><li><b>Primero (futuro posible):</b> If + presente, <b>will</b> + verbo → <i>If I study, I will pass.</i></li></ul><p>Nunca uses «will» dentro del bloque con <i>if</i>. <b>Unless</b> = if not: <i>I won't go unless you come.</i></p>`,
x:[["If I ___ hard, I will pass the exam.",["study","will study","studied"],0,"Después de if → presente."],
["If it rains, we ___ at home.",["stay","will stay","stayed"],1,"Resultado → will + verbo."],

["If she ___ the job, she will move to Bogotá.",["gets","will get","got"],0,"If + presente."]]},
r:{t:'The interview',s:`Last month I applied for a job at an international company. The interview was in English, so I practiced every day. If I get the job, I will work with colleagues from different countries. If I don't get it, I will keep trying, because every interview is a good experience.`,es:`El mes pasado me postulé a un empleo en una empresa internacional. La entrevista fue en inglés, así que practiqué todos los días. Si consigo el trabajo, trabajaré con colegas de distintos países. Si no lo consigo, seguiré intentando, porque cada entrevista es una buena experiencia.`,q:[["Why did the speaker practice English?",["The interview was in English","For a trip","For an exam"],0],["What will happen if the speaker doesn't get the job?",["Will keep trying","Will stop","Will travel"],0]]},
w:{p:'Escribe 5 frases con «If…» sobre tu futuro profesional.',m:`If I finish my degree, I will look for a job. If I speak English well, I will work in an international company. If I save money, I will travel.`,k:["If I","I will","unless"],n:45}});

g:{t:'Comparativos, superlativos y should',h:`<ul><li><b>Corto:</b> -er than / the -est → <i>taller than, the tallest</i> (hot → hotter, big → bigger).</li><li><b>Largo:</b> more… than / the most… → <i>more interesting than, the most interesting</i>.</li><li><b>Irregulares:</b> good → better → the best; bad → worse → the worst.</li><li><b>should</b> = consejo → <i>You should rest.</i></li></ul>`,
x:[["This book is ___ than that one.",["interesting","more interesting","most interesting"],1,"Adjetivo largo → more…than."],

["You ___ see a doctor. (consejo)",["should","must to","shoulds"],0,"should + verbo base."],
["It is ___ expensive restaurant in the city.",["the more","the most","most"],1,"Superlativo largo → the most."]]},
r:{t:'Online or in class?',s:`In my opinion, studying online has one big advantage: you can study anywhere. However, it is harder to stay motivated than in a classroom. Although online classes are cheaper, I think face-to-face classes are better for speaking practice.`,es:`En mi opinión, estudiar en línea tiene una gran ventaja: puedes estudiar en cualquier lugar. Sin embargo, es más difícil mantenerse motivado que en un salón. Aunque las clases en línea son más baratas, creo que las presenciales son mejores para practicar la conversación.`,q:[["What is the main advantage of online study?",["Study anywhere","It is free","It is faster"],0],["What is better for speaking practice?",["Face-to-face classes","Online classes","Books"],0]]},
w:{p:'Escribe tu opinión sobre estudiar online vs. presencial con una ventaja y una desventaja (mínimo 5 frases).',m:`In my opinion, online classes are more flexible. However, they are less social. Compared to face-to-face classes, they are cheaper. I think the best option is a mix of both.`,k:["In my opinion","However","Although","I think"],n:50}});

g:{t:'Condicionales 2 y 3 y «wish»',h:`<ul><li><b>2.º (irreal presente):</b> If + pasado simple, <b>would</b> + verbo → <i>If I were rich, I would travel.</i> (con I/he/she se usa <i>were</i>).</li><li><b>3.º (irreal pasado):</b> If + past perfect, <b>would have</b> + participio → <i>If I had studied, I would have passed.</i></li><li><b>wish:</b> wish + pasado (presente irreal) / wish + past perfect (arrepentimiento).</li></ul>`,
x:[["If I ___ rich, I would travel the world.",["am","were","will be"],1,"Hipótesis irreal → were."],

r:{t:'Second chances',s:`If I could go back, I would study abroad when I was younger. I regret not taking more risks. If I had applied for that scholarship, my life would have been different. Still, if I keep learning, I will create new opportunities.`,es:`Si pudiera volver atrás, estudiaría en el extranjero cuando era más joven. Lamento no haber tomado más riesgos. Si hubiera solicitado esa beca, mi vida habría sido diferente. Aun así, si sigo aprendiendo, crearé nuevas oportunidades.`,q:[["What does the speaker regret?",["Not taking more risks","Studying too much","Moving abroad"],0],["What would have happened with the scholarship?",["Life would have been different","Nothing","It would have been harder"],0]]},
w:{p:'Escribe 3 hipótesis irreales y 2 arrepentimientos del pasado (mínimo 5 frases).',m:`If I spoke perfect English, I would work abroad. If I had more money, I would buy a house. I wish I had started earlier. If I had practiced more, I would have passed the test.`,k:["If I","would","I wish","would have"],n:70}});

r:{t:'Company news',s:`The company was founded in 1998 and it has been growing ever since. Last year a new factory was built in Mexico, and products are now exported to twelve countries. A new tariff was introduced in March, so prices will be reviewed next quarter.`,es:`La empresa fue fundada en 1998 y ha estado creciendo desde entonces. El año pasado se construyó una nueva fábrica en México, y los productos ahora se exportan a doce países. En marzo se introdujo un nuevo arancel, por lo que los precios serán revisados el próximo trimestre.`,q:[["Where was the new factory built?",["Mexico","Spain","Peru"],0],["What will be reviewed next quarter?",["Prices","Contracts","Salaries"],0]]},

r:{t:'The meeting',s:`At the meeting, the manager said that sales had fallen by five percent. She pointed out that the main problem was the new tariff. Her colleague suggested looking for new suppliers, but the director refused to change the plan. According to the report, the situation would improve next year.`,es:`En la reunión, la gerente dijo que las ventas habían caído un cinco por ciento. Señaló que el problema principal era el nuevo arancel. Su colega sugirió buscar nuevos proveedores, pero el director se negó a cambiar el plan. Según el informe, la situación mejoraría el próximo año.`,q:[["What did the colleague suggest?",["Looking for new suppliers","Closing the office","Raising prices"],0],["What did the director do?",["Refused to change the plan","Accepted the idea","Left the meeting"],0]]},
w:{p:'Cuenta en estilo indirecto una conversación real o imaginada (mínimo 5 frases).',m:`My teacher said that I was improving. She told me that I should read more. I said that I would try. She suggested watching series in English.`,k:["said that","told me","suggested","would"],n:70}});
</script>

g:{t:'Imparfait vs passé composé',h:`<ul><li><b>Imparfait</b>: descripciones, hábitos y acciones en curso en el pasado. Raíz de «nous» + <b>-ais, -ais, -ait, -ions, -iez, -aient</b> → <i>je jouais</i>.</li><li><b>Passé composé</b>: acciones puntuales y terminadas → <i>j'ai trouvé</i>.</li></ul><p>Truco: el imparfait es el «fondo» de la escena (cómo era todo); el passé composé es lo que «pasó» (el evento).</p>`,

r:{t:'Quand j\'étais petite',s:`Quand j'étais petite, j'habitais à la campagne. Chaque été, nous allions chez mes grands-parents. Un jour, pendant que je jouais dans le jardin, j'ai trouvé un petit chat. C'est un souvenir que j'aime beaucoup.`,es:`Cuando era pequeña, vivía en el campo. Cada verano íbamos donde mis abuelos. Un día, mientras jugaba en el jardín, encontré un gatito. Es un recuerdo que quiero mucho.`,q:[["¿Dónde vivía de pequeña?",["En el campo","En la ciudad","En la playa"],0],["¿Qué encontró un día?",["Un gatito","Un perro","Un libro"],0]]},

g:{t:'Futur simple y conditionnel',h:`<ul><li><b>Futur simple</b>: infinitivo + <b>-ai, -as, -a, -ons, -ez, -ont</b> → <i>je parlerai</i>. Irregulares: être → <i>serai</i>, avoir → <i>aurai</i>, aller → <i>irai</i>, faire → <i>ferai</i>.</li><li><b>Conditionnel</b> (mismas raíces + terminaciones del imparfait): <i>je voudrais, je pourrais, ce serait</i>. Sirve para cortesía y deseos.</li><li><b>Si + imparfait → conditionnel</b>: <i>Si j'avais le temps, je voyagerais.</i></li></ul>`,

r:{t:'Mon avenir',s:`Dans cinq ans, je serai diplômée en commerce international. J'espère travailler dans une entreprise à l'étranger. Si j'avais le choix, je choisirais la France, parce que j'adore la culture et la langue.`,es:`Dentro de cinco años, me habré graduado en comercio internacional. Espero trabajar en una empresa en el extranjero. Si pudiera elegir, elegiría Francia, porque adoro la cultura y la lengua.`,q:[["¿Qué estudia?",["Comercio internacional","Medicina","Arte"],0],["¿Qué país elegiría?",["Francia","Italia","Canadá"],0]]},

g:{t:'Le subjonctif présent',h:`<p>Raíz de «ils» del presente + <b>-e, -es, -e, -ions, -iez, -ent</b> → <i>que je parle</i>.</p><p><b>Irregulares clave:</b> être → <i>sois</i>, avoir → <i>aie</i>, aller → <i>aille</i>, faire → <i>fasse</i>, pouvoir → <i>puisse</i>.</p><p><b>Se usa tras:</b> necesidad (il faut que), deseo (vouloir que), duda (douter que), emoción (regretter que), y conjunciones como <i>bien que, pour que, à condition que</i>.</p><p>Ojo: <i>penser que</i> afirmativo → indicativo.</p>`,

r:{t:'L\'entretien',s:`Pour réussir un entretien, il faut que vous soyez préparé. Il est important que vous connaissiez l'entreprise et que vous posiez des questions. Bien que ce soit stressant, il vaut mieux que vous restiez calme.`,es:`Para tener éxito en una entrevista, es necesario que esté preparado. Es importante que conozca la empresa y que haga preguntas. Aunque sea estresante, es mejor que se mantenga tranquilo.`,q:[["¿Qué es importante?",["Conocer la empresa","Llegar tarde","Hablar poco"],0],["¿Qué conviene mantener?",["La calma","El silencio","La prisa"],0]]},
w:{p:'Escribe 4 consejos para un amigo usando el subjonctif (il faut que…, il est important que…, je veux que…). Mínimo 4 frases.',m:`Il faut que tu étudies chaque jour. Il est important que tu sois patient. Je veux que tu réussisses. Bien que ce soit difficile, il faut que tu continues.`,k:["Il faut que","Il est important que","Je veux que","Bien que"],n:35}});

r:{t:'Le commerce international',s:`Le marché international évolue rapidement. En effet, de nombreuses entreprises cherchent de nouveaux clients à l'étranger. Pourtant, exporter n'est pas simple : il faut connaître les règles douanières. Par conséquent, la formation est essentielle.`,es:`El mercado internacional evoluciona rápidamente. En efecto, muchas empresas buscan nuevos clientes en el extranjero. Sin embargo, exportar no es sencillo: hay que conocer las reglas aduaneras. Por consiguiente, la formación es esencial.`,q:[["¿Qué es esencial?",["La formación","El azar","El precio"],0],["¿Qué hay que conocer?",["Las reglas aduaneras","Los horarios","La moda"],0]]},
w:{p:'Escribe 4 frases argumentando sobre exportar o estudiar idiomas con los conectores cependant, en effet, donc, malgré.',m:`Apprendre une langue est difficile ; cependant, c'est très utile. En effet, on peut travailler à l'étranger. Malgré les difficultés, je continue. Donc je pratique chaque jour.`,k:["cependant","en effet","donc","malgré"],n:40}});

g:{t:'Essere (ser/estar) y chiamarsi',h:`<p><b>Essere</b>: io <b>sono</b>, tu <b>sei</b>, lui/lei <b>è</b>, noi <b>siamo</b>, voi <b>siete</b>, loro <b>sono</b>.</p><p>Para presentarte: <b>Mi chiamo</b> + nombre. El italiano suele omitir el pronombre: «Sono colombiana».</p><p>Pronunciación: se lee como se escribe. <b>c</b> + e/i suena «ch» (ciao); <b>gli</b> suena «lli» fuerte (famiglia); las consonantes dobles se alargan (pala ≠ palla).</p>`,
x:[["Io ___ colombiana.",["sono","sei","è"],0,"io → sono."],
["Tu ___ studente?",["sono","sei","è"],1,"tu → sei."],
["Lei ___ italiana.",["sono","sei","è"],2,"lei → è."],
["Noi ___ amici.",["siamo","siete","sono"],0,"noi → siamo."],
["Loro ___ a Roma.",["siamo","siete","sono"],2,"loro → sono."]]},
r:{t:'Mi presento',s:`Ciao! Mi chiamo Laura. Sono colombiana e abito a Bucaramanga. Sono studentessa. Mi piacciono la musica e l'italiano.`,es:`¡Hola! Me llamo Laura. Soy colombiana y vivo en Bucaramanga. Soy estudiante. Me gustan la música y el italiano.`,q:[["Laura è…",["Italiana","Colombiana","Francese"],1],["¿Qué es Laura?",["Estudiante","Profesora","Doctora"],0]]},
w:{p:'Preséntate en italiano: nombre, nacionalidad, ciudad y gustos (mínimo 4 frases).',m:`Ciao! Mi chiamo Anna. Sono colombiana. Abito a Bogotá. Mi piace la musica.`,k:["Mi chiamo","Sono","Abito","Mi piace"],n:12}});

r:{t:'La mia famiglia',s:`Questa è la mia famiglia. Mia madre si chiama Claudia e mio padre si chiama Marco. Ho un fratello e una sorella. Mio nonno abita con noi.`,es:`Esta es mi familia. Mi madre se llama Claudia y mi padre se llama Marco. Tengo un hermano y una hermana. Mi abuelo vive con nosotros.`,q:[["¿Cuántos hermanos tiene?",["Dos (un hermano y una hermana)","Uno","Tres"],0],["¿Quién vive con ellos?",["El abuelo","La abuela","Un amigo"],0]]},

r:{t:'Al ristorante',s:`Al ristorante Maria dice: «Buonasera, vorrei una pasta al pomodoro, per favore.» Il cameriere chiede: «Da bere?» Maria risponde: «Acqua naturale, grazie.» La pasta è deliziosa!`,es:`En el restaurante María dice: «Buenas noches, quisiera una pasta al tomate, por favor». El mesero pregunta: «¿Para beber?». María responde: «Agua sin gas, gracias». ¡La pasta está deliciosa!`,q:[["¿Qué pide María?",["Pasta al tomate","Pizza","Ensalada"],0],["¿Qué bebe?",["Agua","Vino","Jugo"],0]]},

g:{t:'Passato prossimo: avere / essere + participio',h:`<p><b>Auxiliar + participio</b>. Participios regulares: -are → <b>-ato</b>, -ere → <b>-uto</b>, -ire → <b>-ito</b>.</p><ul><li>Con <b>avere</b> (la mayoría): <i>ho mangiato, abbiamo visitato</i></li><li>Con <b>essere</b> (andare, arrivare, partire, venire, uscire…): el participio <b>concuerda</b>: <i>lei è partita, loro sono partiti</i>.</li></ul>`,

r:{t:'Un viaggio a Roma',s:`L'estate scorsa ho viaggiato in Italia con mia sorella. Siamo arrivate a Roma la mattina. Abbiamo visitato il Colosseo e abbiamo mangiato la pizza. È stato un viaggio bellissimo!`,es:`El verano pasado viajé a Italia con mi hermana. Llegamos a Roma por la mañana. Visitamos el Coliseo y comimos pizza. ¡Fue un viaje hermosísimo!`,q:[["¿Con quién viajó?",["Con su hermana","Sola","Con un amigo"],0],["¿Qué visitaron?",["El Coliseo","El Vaticano","Pompeya"],0]]},

g:{t:'Imperfetto vs passato prossimo',h:`<ul><li><b>Imperfetto</b>: descripciones, hábitos, acciones en curso → <i>parlavo, parlavi, parlava, parlavamo, parlavate, parlavano</i> (-ere/-ire: -evo, -ivo…).</li><li><b>Passato prossimo</b>: acciones puntuales terminadas → <i>ho trovato</i>.</li></ul><p>Truco: el imperfetto es el «fondo» de la escena; el passato prossimo es lo que «pasó».</p>`,

r:{t:'Da piccola',s:`Da piccola abitavo in campagna. Ogni estate andavamo dai nonni. Un giorno, mentre giocavo in giardino, ho trovato un gattino. È un ricordo che amo molto.`,es:`De pequeña vivía en el campo. Cada verano íbamos donde los abuelos. Un día, mientras jugaba en el jardín, encontré un gatito. Es un recuerdo que quiero mucho.`,q:[["¿Dónde vivía de pequeña?",["En el campo","En la ciudad","En la playa"],0],["¿Qué encontró un día?",["Un gatito","Un perro","Un libro"],0]]},

g:{t:'Futuro semplice e condizionale',h:`<ul><li><b>Futuro</b>: raíz del infinitivo + <b>-ò, -ai, -à, -emo, -ete, -anno</b> → <i>parlerò</i> (-are → -erò). Irregulares: essere → <i>sarò</i>, avere → <i>avrò</i>, andare → <i>andrò</i>, fare → <i>farò</i>.</li><li><b>Condizionale</b>: <i>vorrei, potrei, sarebbe</i> → cortesía y deseos.</li><li><b>Se + congiuntivo imperfetto → condizionale</b>: <i>Se avessi tempo, viaggerei.</i></li></ul>`,

r:{t:'Il mio futuro',s:`Tra cinque anni mi laureerò in commercio internazionale. Spero di lavorare in un'azienda all'estero. Se potessi scegliere, sceglierei l'Italia, perché amo la cultura e la lingua.`,es:`Dentro de cinco años me graduaré en comercio internacional. Espero trabajar en una empresa en el extranjero. Si pudiera elegir, elegiría Italia, porque amo la cultura y la lengua.`,q:[["¿Qué estudia?",["Comercio internacional","Medicina","Arte"],0],["¿Qué país elegiría?",["Italia","Francia","Canadá"],0]]},

g:{t:'Il congiuntivo presente',h:`<p><b>-are</b>: che io parl<b>i</b> (las tres personas del singular iguales). <b>-ere / -ire</b>: che io prend<b>a</b>, dorm<b>a</b>.</p><p><b>Irregulares clave:</b> essere → <i>sia</i>, avere → <i>abbia</i>, andare → <i>vada</i>, fare → <i>faccia</i>, potere → <i>possa</i>, stare → <i>stia</i>.</p><p><b>Se usa tras:</b> opinión (penso che), duda, deseo (spero che), emoción, y conjunciones como <i>benché, affinché, a meno che</i>. Con certeza («so che») va indicativo.</p>`,
x:[["Penso che lui ___ ragione. (avere)",["ha","abbia","avrà"],1,"penso che → congiuntivo."],

r:{t:'Il colloquio',s:`Per riuscire a un colloquio di lavoro, è importante che tu sia preparato. Penso che sia utile conoscere l'azienda e fare domande. Benché sia stressante, è meglio che tu resti calmo.`,es:`Para tener éxito en una entrevista de trabajo, es importante que estés preparado. Pienso que es útil conocer la empresa y hacer preguntas. Aunque sea estresante, es mejor que te mantengas tranquilo.`,q:[["¿Qué es útil?",["Conocer la empresa","Llegar tarde","Hablar poco"],0],["¿Qué conviene mantener?",["La calma","El silencio","La prisa"],0]]},
w:{p:'Escribe 4 consejos para un amigo usando el congiuntivo (penso che…, è importante che…, voglio che…). Mínimo 4 frases.',m:`Penso che tu debba studiare ogni giorno. È importante che tu sia paziente. Voglio che tu riesca. Benché sia difficile, è meglio che tu continui.`,k:["Penso che","È importante che","Voglio che","Benché"],n:35}});

g:{t:'Pronombres combinados',h:`<p>Cuando juntas pronombre indirecto + directo, el indirecto cambia: <b>mi → me, ti → te, ci → ce, vi → ve</b> + lo/la/li/le. Y <b>gli / le → glie-</b> (todo junto: <i>glielo</i>).</p><ul><li><i>Mi dai il libro? Sì, <b>te lo</b> do.</i></li><li><i>Do il regalo a Maria → <b>Glielo</b> do.</i></li><li><i>Mi presti la penna? Sì, <b>te la</b> presto.</i></li></ul>`,
x:[["Mi dai il libro? Sì, ___ do.",["te lo","me lo","lo ti"],0,"ti → te + lo."],

r:{t:'Il commercio internazionale',s:`Il mercato internazionale cambia velocemente. Infatti, molte aziende cercano nuovi clienti all'estero. Tuttavia, esportare non è semplice: bisogna conoscere le regole doganali. Quindi la formazione è essenziale.`,es:`El mercado internacional cambia rápidamente. De hecho, muchas empresas buscan nuevos clientes en el extranjero. Sin embargo, exportar no es sencillo: hay que conocer las reglas aduaneras. Por lo tanto, la formación es esencial.`,q:[["¿Qué es esencial?",["La formación","El azar","El precio"],0],["¿Qué hay que conocer?",["Las reglas aduaneras","Los horarios","La moda"],0]]},
w:{p:'Escribe 4 frases argumentando con tuttavia, infatti, quindi, nonostante.',m:`Imparare una lingua è difficile; tuttavia è molto utile. Infatti si può lavorare all'estero. Nonostante le difficoltà, continuo. Quindi pratico ogni giorno.`,k:["tuttavia","infatti","quindi","nonostante"],n:40}});
</script>

g:{t:'Cómo se arma una sílaba en hangul',h:`<p>El hangul se escribe en <b>bloques de sílaba</b>: consonante + vocal (+ consonante final llamada <i>batchim</i>).</p><ul><li>Vocales <b>verticales</b> (ㅏ ㅣ) van a la <b>derecha</b>: ㄱ + ㅏ = <b>가</b> (ga).</li><li>Vocales <b>horizontales</b> (ㅗ ㅜ ㅡ) van <b>debajo</b>: ㅁ + ㅗ = <b>모</b> (mo).</li><li><b>ㅇ</b> al inicio es <b>muda</b>: ㅇ + ㅏ = <b>아</b> (a). Al final suena «ng».</li></ul><p>Truco: lee cada bloque de izquierda a derecha y de arriba hacia abajo. ¡Aprender hangul toma solo un día; dominarlo, práctica!</p>`,

 ko:['Hangul se aprende en un día, pero dominarlo exige práctica: escribe sílabas a mano.','En coreano el verbo va siempre al final de la frase.','Habla primero en cortés (-요) y deja la 반말 para amigos cercanos.','Las partículas (은/는, 이/가, 을/를) marcan el rol de cada palabra: ¡son tus mejores amigas!','Escucha K-pop y dramas, pero repite frases cortas en voz alta.']

<script>'use strict';
/* ========== CONFIG ========== */
const LANGS={
 en:{name:'Inglés',flag:'🇬🇧',tts:'en-US',color:'#C2548A'},
 fr:{name:'Francés',flag:'🇫🇷',tts:'fr-FR',color:'#5B6FD6'},
 it:{name:'Italiano',flag:'🇮🇹',tts:'it-IT',color:'#2F9C78'},
 ko:{name:'Coreano',flag:'🇰🇷',tts:'ko-KR',color:'#E0705A'}
};
const LV=['a1','a2','b1','b2'];
const LVN={a1:'Principiante',a2:'Básico',b1:'Intermedio',b2:'Int. alto'};
const ACTS=[['v','Vocabulario','📖'],['g','Gramática','🧩'],['l','Escucha','🎧'],['r','Lectura','📰'],['w','Escritura','✍️'],['s','Habla','🎤']];
const KEY='academia-idiomas-v1';
const DEF={lang:'en',xp:0,days:{},streak:0,best:0,last:'',freezes:0,done:{},srs:{},songs:[],badges:{},week:'',weekXp:0,tier:0,goal:30,rate:0.85,diary:[],lvl:{en:'a1',fr:'a1',it:'a1',ko:'a1'},lastRank:null};
let S=Object.assign({},DEF,(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})());
S.lvl=Object.assign({},DEF.lvl,S.lvl||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ========== HELPERS ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)};
const diff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const weekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const dayNum=()=>Math.floor(Date.now()/864e5);
function flash(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(flash.t);flash.t=setTimeout(()=>t.classList.remove('on'),2600)}
const UM={};Object.keys(C).forEach(l=>LV.forEach(v=>(C[l][v]||[]).forEach(u=>UM[u.id]=u)));
const allUnits=l=>LV.reduce((a,v)=>a.concat(C[l][v]||[]),[]);
const doneN=u=>ACTS.filter(a=>(S.done[u.id+':'+a[0]]||0)>=60).length;
const unitsDone=()=>Object.values(UM).filter(u=>doneN(u)===6).length;

/* ========== TEXT / COMPARE ========== */
const norm=s=>String(s).toLowerCase().normalize('NFC').replace(/[’‘]/g,"'").replace(/[.,!?¿¡;:"“”«»'\-–—()]/g,'').replace(/\s+/g,' ').trim();
const strip=s=>norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'');
function judge(a,b,lang){if(lang==='ko'){a=a.replace(/\s/g,'');b=b.replace(/\s/g,'')}if(norm(a)===norm(b))return 2;if(strip(a)===strip(b))return 1;return 0}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function sim(a,b){a=strip(a).replace(/\s/g,'');b=strip(b).replace(/\s/g,'');if(!a&&!b)return 1;return 1-lev(a,b)/Math.max(a.length,b.length,1)}
const isJamo=w=>/^[ㄱ-ㅣ]$/.test(w);
const sayText=x=>isJamo(x.w)?x.ex:x.w;

/* ========== VOICE ========== */
let VOICES=[];
function loadV(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function pickVoice(code){const pre=code.slice(0,2);const exact=VOICES.filter(v=>v.lang.replace('_','-')===code);const any=VOICES.filter(v=>v.lang.slice(0,2)===pre);return exact.find(v=>/natural|google|premium|enhanced/i.test(v.name))||exact[0]||any[0]}
function speak(text,lang,rate,pitch,cb){
 if(!('speechSynthesis' in window)){flash('Tu navegador no tiene voz. Prueba Chrome o Safari.');cb&&cb();return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const code=LANGS[lang||S.lang].tts;u.lang=code;const v=pickVoice(code);if(v)u.voice=v;u.rate=rate||S.rate;u.pitch=pitch||1;if(cb){u.onend=cb;u.onerror=cb}speechSynthesis.speak(u)}catch(e){cb&&cb()}
}

/* ========== XP / STREAK / WEEK / BADGES ========== */
const BOTS=['Valentina','Camille','Haru','Giulia','Min-jun','Sofía','Léa','Jin','Emma'];
const TIERS=['Bronce','Plata','Oro','Zafiro','Rubí','Diamante'];
const TIERE=['🥉','🥈','🥇','💠','♦️','💎'];
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function botXp(n,wk,tier,prog){const h=hash(n+wk);const base=160+tier*140+(h%220);return Math.round(base*prog*(0.75+((h>>3)%50)/100))}
function weekProg(){const d=new Date();const k=(d.getDay()+6)%7;return Math.min(1,(k+d.getHours()/24+0.15)/7)}
function standings(prog,xp,tier,wk){const rows=BOTS.map(n=>({n,xp:botXp(n,wk,tier,prog)}));rows.push({n:'Tú',xp:xp,me:true});rows.sort((a,b)=>b.xp-a.xp||(a.me?-1:1));return rows}
function settleWeek(){
 if(S.weekXp<=0){S.lastRank=null;return}
 const rows=standings(1,S.weekXp,S.tier,S.week);const rank=rows.findIndex(r=>r.me)+1;
 let msg='';
 if(rank<=3&&S.tier<5){S.tier++;msg='🎉 ¡Subiste a la liga '+TIERS[S.tier]+'!'}
 else if(rank>=8&&S.tier>0){S.tier--;msg='Bajaste a la liga '+TIERS[S.tier]+'. ¡Recupérala esta semana!'}
 S.lastRank={rank,msg};
}
function boot(){
 const t=today();
 if(S.last&&S.last!==t){const g=diff(S.last,t);if(g===2&&S.freezes>0){S.freezes--;S.last=addDays(t,-1);setTimeout(()=>flash('❄️ Tu congelador salvó tu racha'),800)}else if(g>1)S.streak=0}
 const w=weekStart();
 if(S.week!==w){if(S.week)settleWeek();S.week=w;S.weekXp=0}
 save();
}
function addXP(n){
 const t=today();
 if(S.last!==t){S.streak=(S.last&&diff(S.last,t)===1)?S.streak+1:1;if(S.streak>S.best)S.best=S.streak;if(S.streak%7===0)S.freezes++;S.last=t}
 S.xp+=n;S.days[t]=(S.days[t]||0)+n;S.weekXp+=n;
 checkBadges();save();topBar();
}
const langsUsed=()=>Object.keys(LANGS).filter(l=>allUnits(l).some(u=>doneN(u)>0)).length;
const BADGES=[
 ['first','🌱','Primer paso',()=>S.xp>0],['s3','🔥','3 días seguidos',()=>S.best>=3],['s7','🌟','Semana perfecta',()=>S.best>=7],
 ['s30','💎','30 días de racha',()=>S.best>=30],['s100','👑','100 días de racha',()=>S.best>=100],['s365','🏆','Un año entero',()=>S.best>=365],
 ['xp500','✨','500 XP',()=>S.xp>=500],['xp5000','🚀','5000 XP',()=>S.xp>=5000],['w50','📚','50 palabras',()=>Object.keys(S.srs).length>=50],
 ['w200','🧠','200 palabras',()=>Object.keys(S.srs).length>=200],['u5','🎓','5 unidades',()=>unitsDone()>=5],['poly','🌍','Políglota',()=>langsUsed()>=2],
 ['song','🎵','Melómana',()=>S.songs.length>=1],['wr','✍️','Escritora (5 textos)',()=>S.diary.length>=5]
];
function checkBadges(){BADGES.forEach(b=>{if(!S.badges[b[0]]&&b[3]()){S.badges[b[0]]=today();setTimeout(()=>flash(b[1]+' Insignia: '+b[2]),400)}})}

/* ========== SPACED REPETITION ========== */
const INT=[0,1,3,7,14,30,60];
function addSrs(lang,w,es,ex){const k=lang+'|'+w;if(!S.srs[k])S.srs[k]={lang,w,es,ex:ex||'',box:0,due:today()}}
const dueList=lang=>Object.entries(S.srs).filter(([k,c])=>c.lang===lang&&c.due<=today());

/* ========== NAV / TOP / ROUTER ========== */
let V='path',UI={};const VIEWS={};let AFTER=null;
function go(v,o){UI.stop=true;try{speechSynthesis.cancel()}catch(e){}V=v;if(o)Object.assign(UI,o);render()}
function topBar(){
 $('#pills').innerHTML=`<span class="pill">🔥 <b>${S.streak}</b></span><span class="pill">⭐ <b>${S.xp}</b></span><button class="iconbtn" data-a="go" data-v="teachers" title="Tus profes">🎓</button>`;
 $('#langs').innerHTML=Object.keys(LANGS).map(l=>`<button class="chip ${l===S.lang?'on':''}" data-a="lang" data-l="${l}">${LANGS[l].flag} ${LANGS[l].name}</button>`).join('');
 try{const on=document.querySelector('.chip.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
function nav(){
 const due=dueList(S.lang).length;const root={sess:'path',unit:'path',song:'songs',scene:'series',teachers:'league',diary:'league'}[V]||V;
 const it=[['path','🗺️','Ruta'],['review','🧠','Repaso'],['songs','🎵','Música'],['series','🎬','Series'],['league','🏆','Ranking']];
 $('#nav').innerHTML=it.map(i=>`<button class="${root===i[0]?'on':''}" data-a="go" data-v="${i[0]}"><span class="e">${i[1]}</span>${i[2]}${i[0]==='review'&&due?`<span class="dot">${due>99?'99+':due}</span>`:''}</button>`).join('');
}
function render(){
 document.documentElement.style.setProperty('--ac',LANGS[S.lang].color);
 document.querySelector('meta[name=theme-color]').setAttribute('content','#3B1F47');
 topBar();nav();closeSheet();
 const f=VIEWS[V]||VIEWS.path;$('#app').innerHTML=f();
 window.scrollTo(0,0);
 if(AFTER){const a=AFTER;AFTER=null;a()}
}
function openSheet(h){$('#layer').innerHTML=`<div class="scrim" data-a="closesheet"></div><div class="sheet">${h}</div>`}
function closeSheet(){const l=$('#layer');if(l)l.innerHTML=''}

/* ========== VIEWS: PATH & UNIT ========== */
function vPath(){
 const lang=S.lang,lv=S.lvl[lang],units=C[lang][lv]||[];
 const tx=S.days[today()]||0,pct=Math.min(100,Math.round(tx/S.goal*100));
 const T=TEACH[lang],tips=TIPS[lang],tip=tips[dayNum()%tips.length];
 let next=-1;units.forEach((u,i)=>{if(next<0&&doneN(u)<6)next=i});
 const tabs=LV.map(v=>{const us=C[lang][v]||[];const tot=us.length*6||1;const dn=us.reduce((a,u)=>a+doneN(u),0);return `<button class="lvtab ${v===lv?'on':''}" data-a="lvl" data-v="${v}">${v.toUpperCase()}<small>${Math.round(dn/tot*100)}%</small></button>`}).join('');
 const nodes=units.map((u,i)=>{const n=doneN(u);return `<button class="node ${n===6?'done':''}" data-a="unit" data-id="${u.id}"><div class="bub" style="--p:${Math.round(n/6*100)}"><span>${n===6?'🏅':u.emoji}</span></div><div><div class="t">${esc(u.title)}</div><div class="muted small">${n}/6 actividades${i===next?' · <b style="color:var(--ac)">👉 sigue aquí</b>':''}</div></div></button>`}).join('');
 return `<div class="card"><div class="hero"><div class="ring" style="--p:${pct}"><span>${tx}</span></div><div><h2>Meta de hoy</h2><div class="muted small">${tx>=S.goal?'¡Meta cumplida! 🎉':`${tx} / ${S.goal} XP · ${S.last===today()?'racha asegurada ✅':'practica para mantener tu racha'}`}</div></div></div>
 <div class="row" style="margin-top:14px;align-items:flex-start"><div class="avatar">${T.icon}</div><div class="bubble"><b>${T.name}:</b> ${esc(tip)}</div></div></div>
 <div class="lvtabs">${tabs}</div>
 <h2 style="margin-top:18px">${LANGS[lang].flag} ${LANGS[lang].name} · ${lv.toUpperCase()} <span class="muted small" style="font-family:system-ui">${LVN[lv]}</span></h2>
 <div class="path">${nodes||'<div class="card muted">Pronto habrá más unidades aquí.</div>'}</div>`;
}
VIEWS.path=vPath;

function vUnit(){
 const u=UM[UI.unit];if(!u)return vPath();const T=TEACH[u.lang];
 const items=ACTS.map(a=>{const sc=S.done[u.id+':'+a[0]]||0;const ok=sc>=60;return `<button class="act ${ok?'ok':''}" data-a="act" data-t="${a[0]}">${ok?'<span class="ck">✓</span>':''}<div class="ic">${a[2]}</div><div class="nm">${a[1]}</div><small>${sc?sc+'%':'+XP'}</small></button>`}).join('');
 return `<button class="back" data-a="go" data-v="path">← Ruta</button>
 <h2>${u.emoji} ${esc(u.title)}</h2><span class="tag">${u.lvl.toUpperCase()}</span>
 <div class="row" style="margin-top:14px;align-items:flex-start"><div class="avatar">${T.icon}</div><div class="bubble"><b>${T.name}:</b> En esta unidad aprenderás ${u.v.length} palabras clave y «${esc(u.g.t)}». ¡Hazlo en orden o salta a lo que quieras!</div></div>
 <div class="acts">${items}</div>
 <div class="card"><b>Palabras de la unidad</b><div class="chips">${u.v.map(x=>`<span class="chip2">${esc(x.w)}</span>`).join('')}</div></div>`;
}
VIEWS.unit=vUnit;

/* ========== HANDLERS ========== */
const H={
 go:d=>go(d.v),
 lang:d=>{S.lang=d.l;save();V='path';render()},
 lvl:d=>{S.lvl[S.lang]=d.v;save();render()},
 unit:d=>go('unit',{unit:d.id}),
 say:(d,t)=>speak(d.t,d.l||S.lang,d.slow?0.55:null),
 closesheet:closeSheet
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=H[t.dataset.a];if(f)f(t.dataset,t,e)});

<script>'use strict';
/* ========== SESIONES DE ACTIVIDADES ========== */
let SS=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function refresh(){$('#app').innerHTML=VIEWS[V]();if(AFTER){const a=AFTER;AFTER=null;a()}}
const pools=u=>{const all=[];LV.forEach(l=>(C[u.lang][l]||[]).forEach(x=>all.push(...x.v)));return all};
function mcq(q,correct,pool,o){
 const d=shuffle(pool.filter((x,i,a)=>x!==correct&&a.indexOf(x)===i)).slice(0,3);
 const opts=shuffle([correct].concat(d));
 return Object.assign({t:'mcq',q,opts,a:opts.indexOf(correct)},o||{});
}
const sentencesOf=u=>u.v.filter(x=>x.ex).map(x=>({t:x.ex,es:x.exEs})).concat(u.l.filter(x=>x.es));

/* ---- constructores ---- */
function buildV(u){
 const P=pools(u),es=P.map(x=>x.es),ws=P.map(x=>x.w),st=[];
 u.v.forEach(x=>st.push({t:'card',x}));
 shuffle(u.v).forEach(x=>st.push(mcq(`¿Qué significa «${x.w}»?`,x.es,es,{say:sayText(x)})));
 shuffle(u.v).slice(0,4).forEach(x=>st.push(mcq(`¿Cómo se dice «${x.es}»?`,x.w,ws)));
 if(!isJamo(u.v[0].w))shuffle(u.v).slice(0,4).forEach(x=>st.push(mcq('🎧 ¿Qué palabra escuchas?',x.w,ws,{say:sayText(x),auto:1})));
 return st;
}
function buildG(u){
 const st=[{t:'info',title:u.g.t,h:u.g.h}];
 u.g.x.forEach(x=>{const ans=x[1][x[2]],sh=shuffle(x[1]);st.push({t:'mcq',q:x[0],opts:sh,a:sh.indexOf(ans),exp:x[3]})});
 return st;
}
function buildL(u){
 const S1=sentencesOf(u),poolEs=[];(C[u.lang][u.lvl]||[]).forEach(x=>sentencesOf(x).forEach(s=>poolEs.push(s.es)));
 const st=[];
 shuffle(S1).slice(0,4).forEach(s=>st.push(mcq('🎧 Escucha y elige el significado',s.es,poolEs,{say:s.t,auto:1})));
 shuffle(S1).slice(0,4).forEach(s=>st.push({t:'type',q:'✍️ Dictado: escribe lo que escuchas',say:s.t,ans:s.t,es:s.es}));
 return st;
}
function buildR(u){
 const st=[{t:'read',title:u.r.t,s:u.r.s,es:u.r.es}];
 u.r.q.forEach(x=>{const ans=x[1][x[2]],sh=shuffle(x[1]);st.push({t:'mcq',q:x[0],opts:sh,a:sh.indexOf(ans),exp:''})});
 return st;
}
const buildW=u=>[{t:'write',p:u.w.p,m:u.w.m,k:u.w.k||[],n:Math.max(5,Math.min(u.w.n||12,Math.round(wc(u.w.m)*0.8)))}];
function buildS(u){return shuffle(sentencesOf(u)).slice(0,6).map(s=>({t:'speak',tx:s.t,es:s.es}))}
const BUILD={v:buildV,g:buildG,l:buildL,r:buildR,w:buildW,s:buildS};
const BASE={v:20,g:20,l:20,r:15,w:25,s:20};

function startSession(u,act){SS={u,act,steps:BUILD[act](u),i:0,ok:0,tot:0,ans:null,fin:false,res:null,played:-1,tr:false,rec:false,text:''};go('sess')}
H.act=d=>startSession(UM[UI.unit],d.t);
H.quit=()=>{try{speechSynthesis.cancel()}catch(e){}SS=null;go('unit')};
H.back2unit=()=>{SS=null;go('unit')};
H.retry=()=>startSession(SS.u,SS.act);

/* ---- vista de sesión ---- */
function vSess(){
 if(!SS)return vPath();
 if(SS.i>=SS.steps.length)return vFinish();
 const st=SS.steps[SS.i],u=SS.u,T=TEACH[u.lang],pct=Math.round(SS.i/SS.steps.length*100);
 let b='';
 if(st.t==='card'){
  const x=st.x,sx=sayText(x);

 }else if(st.t==='info'){
  b=`<div class="card grammar"><div class="row" style="align-items:flex-start;margin-bottom:8px"><div class="avatar" style="flex:0 0 42px">${T.icon}</div><div class="bubble"><b>${T.name}</b> te explica:</div></div><h3>${esc(st.title)}</h3>${st.h}</div><button class="btn" data-a="next">¡Entendido! A practicar</button>`;
 }else if(st.t==='mcq'){
  const A=SS.ans;
  if(st.auto&&SS.played!==SS.i&&A===null){SS.played=SS.i;AFTER=()=>setTimeout(()=>speak(st.say,u.lang),350)}
  b=`<h2 class="q">${esc(st.q)}</h2>${st.say?`<button class="say big" data-a="say" data-t="${esc(st.say)}">🔊 Escuchar</button><button class="say" data-a="say" data-t="${esc(st.say)}" data-slow="1">🐢</button>`:''}`
   +st.opts.map((o,i)=>`<button class="opt ${A!==null?(i===st.a?'good':(i===A?'bad':'')):''}" data-a="pick" data-i="${i}" ${A!==null?'disabled':''}>${esc(o)}</button>`).join('')
   +(A!==null?`<div class="fb ${A===st.a?'good':'bad'}">${A===st.a?'✅ ¡Correcto!':'❌ Respuesta: <b>'+esc(st.opts[st.a])+'</b>'}${st.exp?'<br>'+esc(st.exp):''}</div><button class="btn" data-a="next">Continuar</button>`:'');
 }else if(st.t==='type'){
  const A=SS.ans;
  if(A===null&&SS.played!==SS.i){SS.played=SS.i;AFTER=()=>setTimeout(()=>speak(st.say,u.lang),350)}
  b=`<h2 class="q">${esc(st.q)}</h2><button class="say big" data-a="say" data-t="${esc(st.say)}">🔊 Escuchar</button><button class="say" data-a="say" data-t="${esc(st.say)}" data-slow="1">🐢 Lento</button><div style="margin-top:12px"><input id="ty" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe lo que escuchas…" ${A?'disabled value="'+esc(A.val)+'"':''}></div>`
   +(A?`<div class="fb ${A.res?'good':'bad'}">${A.res===2?'✅ ¡Perfecto!':A.res===1?'✅ Casi: cuida los acentos.':'❌ No exacto.'}<br><b>${esc(st.ans)}</b><br><span class="small">${esc(st.es)}</span></div><button class="btn" data-a="next">Continuar</button>`:`<button class="btn" data-a="check">Comprobar</button><button class="btn ghost" data-a="skip">No lo sé</button>`);
 }else if(st.t==='read'){
  b=`<span class="tag">Lectura</span><h2 style="margin-top:6px">${esc(st.title)}</h2><div class="card"><div class="read">${esc(st.s)}</div><div style="margin-top:10px"><button class="say" data-a="say" data-t="${esc(st.s)}">🔊 Escuchar texto</button><button class="say" data-a="say" data-t="${esc(st.s)}" data-slow="1">🐢 Lento</button><button class="say" data-a="tog">👁️ Traducción</button></div>${SS.tr?`<div class="muted read" style="margin-top:10px">${esc(st.es)}</div>`:''}</div><button class="btn" data-a="next">Responder preguntas</button>`;
 }else if(st.t==='speak'){
  const A=SS.ans;
  b=`<span class="tag">Repite en voz alta</span><div class="card flash"><div class="w" style="font-size:1.6rem">${esc(st.tx)}</div><div class="muted">${esc(st.es)}</div><button class="say" data-a="say" data-t="${esc(st.tx)}">🔊 Escuchar</button><button class="say" data-a="say" data-t="${esc(st.tx)}" data-slow="1">🐢 Lento</button></div>`;
  if(SR){
   b+=`<button class="mic ${SS.rec?'rec':''}" data-a="mic">🎤</button><div class="muted small center">${SS.rec?'Escuchando…':'Toca el micrófono y di la frase'}</div>`;
   if(A)b+=`<div class="fb ${A.score>=.7?'good':'bad'}">${A.score>=.7?'✅ ¡Muy bien!':'🔁 Casi. Inténtalo otra vez.'} (${Math.round(A.score*100)}%)<br><span class="small">Te entendí: «${esc(A.heard)}»</span></div>`;
  }else{

   if(!A)b+=`<div class="row"><button class="btn alt" data-a="selfno">😅 Otra vez</button><button class="btn" data-a="selfok">✅ Lo dije bien</button></div>`;
  }
  b+=`<button class="btn" data-a="next" ${(A||st.best)?'':'disabled'}>Continuar</button>`;
 }else if(st.t==='write'){

 }
 return `<div class="sbar"><button class="x" data-a="quit">✕</button><div class="prog"><i style="width:${pct}%"></i></div></div>${b}`;

VIEWS.sess=vSess;
const wc=t=>t.trim()?t.trim().split(/\s+/).length:0;

const CHEER=['¡Excelente trabajo! Cada sesión te acerca más.','¡Eso es constancia! Sigue así.','Muy bien. Tu oído y tu memoria están creciendo.','¡Qué elegancia! Un paso más en tu camino.'];
function finish(){
 const u=SS.u,key=u.id+':'+SS.act;
 const pct=SS.tot?Math.round(SS.ok/SS.tot*100):100,pass=pct>=60;
 const first=(S.done[key]||0)<60;
 let xp=Math.round((BASE[SS.act]+SS.ok*2)*(first?1:.5));if(!pass)xp=Math.max(3,Math.round(xp/3));
 S.done[key]=Math.max(S.done[key]||0,pct);
 if(SS.act==='v')u.v.forEach(x=>addSrs(u.lang,x.w,x.es,x.ex));
 addXP(xp);
 return{pct,pass,xp,msg:CHEER[Math.floor(Math.random()*CHEER.length)]};
}
function vFinish(){
 if(!SS.fin){SS.fin=true;SS.res=finish()}
 const r=SS.res,T=TEACH[SS.u.lang];
 return `<div class="card center done"><div class="spark">✨</div><div class="big">${r.pass?'🎉':'💪'}</div><h2>${r.pass?'¡Muy bien!':'Casi lo tienes'}</h2><p style="font-size:1.2rem"><b>${r.pct}%</b> · <b style="color:var(--gold)">+${r.xp} XP</b></p><p class="muted">${T.name}: ${r.pass?r.msg:'Repítelo con calma; el error es parte de aprender.'}</p></div><button class="btn" data-a="back2unit">Continuar</button>${r.pass?'':'<button class="btn alt" data-a="retry">Repetir</button>'}`;
}

/* ---- handlers de sesión ---- */
H.next=()=>{const st=SS.steps[SS.i];if(st.t==='speak'){SS.tot++;if((st.best||0)>=.7)SS.ok++}SS.i++;SS.ans=null;SS.rec=false;SS.tr=false;render()};
H.pick=d=>{const st=SS.steps[SS.i];if(SS.ans!==null)return;const i=+d.i;SS.ans=i;SS.tot++;if(i===st.a)SS.ok++;refresh()};
H.check=()=>{const st=SS.steps[SS.i];if(SS.ans)return;const v=($('#ty').value||'').trim();if(!v){flash('Escribe algo primero');return}const res=judge(v,st.ans,SS.u.lang);SS.ans={val:v,res};SS.tot++;if(res>0)SS.ok++;refresh()};
H.skip=()=>{if(SS.ans)return;SS.ans={val:'',res:0};SS.tot++;refresh()};
H.tog=()=>{SS.tr=!SS.tr;refresh()};
H.selfok=()=>{SS.steps[SS.i].best=1;SS.ans={score:1,heard:''};refresh()};
H.selfno=()=>{flash('Escucha otra vez y repite en voz alta 💪')};
H.mic=()=>{
 if(!SR||SS.rec)return;const st=SS.steps[SS.i];
 try{speechSynthesis.cancel()}catch(e){}
 const r=new SR();r.lang=LANGS[SS.u.lang].tts;r.interimResults=false;r.maxAlternatives=3;SS.rec=true;SS.ans=null;
 r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);const best=Math.max(...alts.map(a=>sim(a,st.tx)));SS.rec=false;st.best=Math.max(st.best||0,best);SS.ans={score:best,heard:alts[0]};refresh()};
 r.onerror=e=>{SS.rec=false;flash('No pude escucharte ('+e.error+'). Revisa el permiso del micrófono.');refresh()};
 r.onend=()=>{if(SS.rec){SS.rec=false;refresh()}};
 try{r.start()}catch(e){SS.rec=false}
 refresh();
};
H.wsub=()=>{
 const st=SS.steps[SS.i];SS.text=$('#wr').value;const n=wc(SS.text);
 if(n<st.n){flash(`Escribe al menos ${st.n} palabras (llevas ${n})`);return}
 SS.ans={words:n};SS.tot=1;SS.ok=1;
 S.diary.unshift({d:today(),lang:SS.u.lang,title:SS.u.title,text:SS.text,model:st.m});if(S.diary.length>60)S.diary.length=60;save();
 refresh();
};
document.addEventListener('input',e=>{if(e.target.id==='wr'&&SS){SS.text=e.target.value;const st=SS.steps[SS.i];const el=$('#wc');if(el)el.textContent=wc(SS.text)+' palabras · mínimo '+st.n}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ty')H.check()});

function vReview(){
 const lang=S.lang,R=UI.rv,total=Object.values(S.srs).filter(c=>c.lang===lang).length;
 if(!R||R.lang!==lang){
  const due=dueList(lang).length;
  return `<h2 style="margin-top:16px">🧠 Repaso inteligente</h2>
  <div class="card center"><div class="spark">${due?'📬':'🌟'}</div><h2>${due} palabra${due===1?'':'s'} para hoy</h2><p class="muted">${total} palabras guardadas en ${LANGS[lang].name}. El repaso espaciado te las muestra justo antes de olvidarlas.</p>
  <button class="btn" data-a="rvstart" ${due?'':'disabled'}>Empezar repaso</button><button class="btn alt" data-a="rvfree" ${total?'':'disabled'}>Practicar 10 al azar</button></div>
  ${total?'':'<div class="card muted">Aún no tienes palabras aquí. Completa «Vocabulario» en una unidad de la Ruta y se guardarán automáticamente.</div>'}`;
 }
 if(R.i>=R.q.length){
  if(!R.fin){R.fin=true;if(R.n&&!R.free)addXP(R.n*2);else if(R.n){addXP(R.n)}}
  return `<div class="card center done"><div class="spark">✨</div><div class="big">🌟</div><h2>¡Repaso completo!</h2><p>${R.n} palabras · <b style="color:var(--gold)">+${R.free?R.n:R.n*2} XP</b></p></div><button class="btn" data-a="rvend">Terminar</button>`;
 }
 const c=S.srs[R.q[R.i]],pct=Math.round(R.i/R.q.length*100),sx=sayText({w:c.w,ex:c.ex});
 return `<div class="sbar"><button class="x" data-a="rvend">✕</button><div class="prog"><i style="width:${pct}%"></i></div></div>
 <div class="card flash"><span class="tag">${R.show?'Respuesta':'¿Recuerdas?'}</span><div class="w">${esc(c.w)}</div><div><button class="say" data-a="say" data-l="${c.lang}" data-t="${esc(sx)}">🔊 Escuchar</button></div>
 ${R.show?`<div class="es">${esc(c.es)}</div>${c.ex?`<div class="ex muted">${esc(c.ex)}</div>`:''}`:''}</div>
 ${R.show?`<div class="row"><button class="btn alt" data-a="rvrate" data-r="0" style="padding:10px 2px">Otra vez</button><button class="btn alt" data-a="rvrate" data-r="1" style="padding:10px 2px">Difícil</button><button class="btn" data-a="rvrate" data-r="2" style="padding:10px 2px">Bien</button><button class="btn gold" data-a="rvrate" data-r="3" style="padding:10px 2px">Fácil</button></div>`:`<button class="btn" data-a="rvshow">Mostrar respuesta</button>`}`;
}

H.rvstart=()=>{UI.rv={lang:S.lang,q:shuffle(dueList(S.lang).map(e=>e[0])).slice(0,30),i:0,show:false,n:0,free:false};refresh()};
H.rvfree=()=>{const ks=Object.keys(S.srs).filter(k=>S.srs[k].lang===S.lang);UI.rv={lang:S.lang,q:shuffle(ks).slice(0,10),i:0,show:false,n:0,free:true};refresh()};
H.rvshow=()=>{UI.rv.show=true;refresh()};
H.rvend=()=>{UI.rv=null;go('review')};
H.rvrate=d=>{
 const R=UI.rv,k=R.q[R.i],c=S.srs[k],r=+d.r;
 if(!R.free){
  if(r===0){c.box=0;c.due=today();R.q.push(k)}
  else{c.box=Math.min(6,r===1?Math.max(1,c.box):c.box+(r===3?2:1));c.due=addDays(today(),r===1?1:INT[c.box])}
 }
 if(r>0)R.n++;R.i++;R.show=false;save();refresh();
};

<script>'use strict';

const enc=encodeURIComponent;

const songObj=s=>({...s,lines:typeof s.lines==='string'?s.lines.trim().split('\n').map(l=>{const p=l.split('|');return{t:p[0],es:p[1]||'',ro:p[2]||''}}):s.lines});
function curSong(){const r=UI.song||{};if(r.src==='lib')return songObj(SONGS.find(s=>s.id===r.id));return S.songs.find(s=>s.id===r.id)}

  <div class="chips"><button class="chip2 ${!g?'hit':''}" data-a="genre" data-g="">Todos</button>${GENRES.map(x=>`<button class="chip2 ${g===x?'hit':''}" data-a="genre" data-g="${x}">${x}</button>`).join('')}</div>`
  +list.map(s=>`<button class="card song" data-a="song" data-src="lib" data-id="${s.id}"><span class="ic">🎵</span><div><b>${esc(s.title)}</b><div class="muted small">${esc(s.by)} · ${s.lvl.toUpperCase()}</div></div></button>`).join('');
 }else if(tab==='mine'){
  const mine=S.songs.filter(s=>s.lang===lang);
  b=`<div class="card"><h3>➕ Agregar una canción</h3><p class="muted small">Busca la letra en un sitio legal (Genius, Musixmatch) y pégala aquí. Se guarda solo en tu teléfono. Si quieres, pega abajo la traducción línea por línea.</p>

  <button class="btn" data-a="songsave">Guardar canción</button></div>`
  +mine.map(s=>`<div class="card song"><button class="song" style="flex:1" data-a="song" data-src="mine" data-id="${s.id}"><span class="ic">🎤</span><div><b>${esc(s.title)}</b><div class="muted small">${esc(s.by||'')} · ${s.lines.length} líneas</div></div></button><button class="x" data-a="songdel" data-id="${s.id}" title="Borrar">🗑️</button></div>`).join('')
  +(mine.length?'':'<div class="card muted small center">Aún no has guardado canciones en este idioma.</div>');
 }else{
  const list=(DISCOVER[lang]||[]).filter(s=>!g||s.g.includes(g));
  b=`<div class="card soft small">🎧 Canciones recomendadas para estudiar (solo títulos: abre la letra y el video en sitios oficiales). Luego pégala en «Mis letras» para estudiarla aquí.</div>`
  +list.map(s=>`<div class="card"><div class="between"><b>${esc(s.t)}</b><span class="tag">${s.l}</span></div><div class="muted small">${esc(s.a)} · ${esc(s.g)}</div><div class="small" style="margin:6px 0">${esc(s.n)}</div><div class="row"><a class="btn alt" style="padding:8px;margin:4px 0" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${enc(s.t+' '+s.a)}">▶️ Escuchar</a><a class="btn alt" style="padding:8px;margin:4px 0" target="_blank" rel="noopener" href="https://genius.com/search?q=${enc(s.t+' '+s.a)}">📝 Letra</a></div></div>`).join('')
  +`<div class="card"><h3>Método para aprender con canciones</h3><div class="small">1. Escucha sin leer.<br>2. Lee la letra con la traducción.<br>3. Toca las palabras nuevas y guárdalas al repaso.<br>4. Canta siguiendo la letra (modo karaoke).<br>5. Juega «Completa la letra» hasta acertar todo.</div></div>`;

 return `<h2 style="margin-top:16px">🎵 Música en ${LANGS[lang].name}</h2>${tabs}${b}`;
